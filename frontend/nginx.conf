server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.rokadschool.ir; media-src 'self' blob: https://api.rokadschool.ir; connect-src 'self' https://api.rokadschool.ir wss://api.rokadschool.ir; font-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # 1. Critical PWA & entry files: never cache
    location ~* ^/(index\.html|sw\.js|registerSW\.js|push-worker\.js|version\.json|manifest\.webmanifest)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # 2. Hashed Vite assets: cache long term
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 3. Media & fonts
    location ~* \.(?:ttf|woff|woff2|png|jpg|jpeg|gif|ico|svg)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # 4. SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
